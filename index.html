<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AR Animals</title>
<script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:sans-serif;background:#e8e4e1}
#name{position:absolute;top:30px;left:50%;transform:translateX(-50%);font-size:28px;font-weight:bold;z-index:5}
#controls{position:absolute;bottom:30px;left:0;right:0;display:flex;justify-content:center;gap:20px;z-index:5}
button{width:60px;height:60px;border-radius:50%;border:none;background:#333;color:#fff;font-size:20px;cursor:pointer}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e8e4e1;z-index:100}
</style>
</head>
<body>

<div id="loading">Loading...</div>

<div id="name"></div>

<div id="controls">
  <button id="prev">‹</button>
  <button id="next">›</button>
</div>

<a-scene vr-mode-ui="enabled:false" background="color:#e8e4e1">
  <a-entity light="type:ambient;intensity:0.8"></a-entity>
  <a-entity light="type:directional;intensity:0.4" position="1 2 1"></a-entity>
  <a-entity camera look-controls="enabled:false"></a-entity>
  <a-entity id="holder" position="0 0 -4"></a-entity>
</a-scene>

<script>
const animals=[
  {model:"models/cheetah/scene.gltf",name:"Cheetah",scale:1.2},
  {model:"models/rabbit/scene.gltf",name:"Rabbit",scale:0.8},
  {model:"models/eagle/scene.gltf",name:"Eagle",scale:1.5},
  {model:"models/wolf/scene.gltf",name:"Wolf",scale:0.6},
  {model:"models/penguin/scene.gltf",name:"Penguin",scale:1.2},
  {model:"models/tiger/scene.gltf",name:"Tiger",scale:1.1}
];

let index=0;
const holder=document.getElementById("holder");
const models=[];

function show(i){
  models.forEach((m,j)=>m.object3D.visible=j===i);
  document.getElementById("name").textContent=animals[i].name;
}

animals.forEach((a,i)=>{
  const m=document.createElement("a-entity");
  m.setAttribute("gltf-model",a.model);
  m.object3D.scale.set(a.scale,a.scale,a.scale);
  m.object3D.visible=false;
  holder.appendChild(m);
  models.push(m);
  m.addEventListener("model-loaded",()=>{
    if(i===0)document.getElementById("loading").style.display="none";
    if(i===0)show(0);
  });
});

document.getElementById("prev").onclick=()=>{index=(index-1+animals.length)%animals.length;show(index)};
document.getElementById("next").onclick=()=>{index=(index+1)%animals.length;show(index)};

let yaw=0;
AFRAME.registerComponent("spin",{tick:function(){
  if(models[index]){yaw+=0.005;models[index].object3D.rotation.y=yaw}
}});
holder.setAttribute("spin","");
</script>

</body>
</html>
